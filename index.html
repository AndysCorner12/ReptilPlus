<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gecko Pairs">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Gecko Pairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
img{max-width:100%}
/* Layout: one-screen app — header, infinite corkboard canvas, collection tray along the bottom */
:root{
  --bg:#F5F1E8; --board:#EFE8DA; --dot:#d6c9ae; --ink:#1d1a16; --muted:#6c6457; --card:#fffdf8; --line:#e0d6c2;
  --male:#6fa8e0; --male-ink:#1f4f80; --male-bg:#dceafa;
  --fem:#ec97b8; --fem-ink:#8a2c55; --fem-bg:#fbe1eb;
  --unk:#b9b0a0; --unk-ink:#5b5448; --unk-bg:#ece6da;
  --peach:#f7c9a6; --peach-ink:#7a3d12; --opt:#3d7fd0; --ok:#2f8a4c; --ok-bg:#dff1e3;
  --danger:#c4372f; --danger-bg:#fbe3e0; --warn-bg:#fdebc8; --warn-ink:#7a4b06;
  --scrim:rgba(29,26,22,.38);
  --f-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1915; --board:#221e19; --dot:#3d362c; --ink:#f3ede2; --muted:#a99f8e; --card:#2c2721; --line:#3f382e;
  --male:#5d97d1; --male-ink:#bcd9f7; --male-bg:#1f3349;
  --fem:#d97aa0; --fem-ink:#f6c3d7; --fem-bg:#4a2334;
  --unk:#7d7568; --unk-ink:#ddd5c6; --unk-bg:#38322a;
  --peach:#8a5330; --peach-ink:#fbd9be; --opt:#7fb0ec; --ok:#6cc088; --ok-bg:#1f3a28;
  --danger:#ff7a6e; --danger-bg:#4a1f1b; --warn-bg:#4a3613; --warn-ink:#f6cf86;
  --scrim:rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1c1915; --board:#221e19; --dot:#3d362c; --ink:#f3ede2; --muted:#a99f8e; --card:#2c2721; --line:#3f382e;
  --male:#5d97d1; --male-ink:#bcd9f7; --male-bg:#1f3349;
  --fem:#d97aa0; --fem-ink:#f6c3d7; --fem-bg:#4a2334;
  --unk:#7d7568; --unk-ink:#ddd5c6; --unk-bg:#38322a;
  --peach:#8a5330; --peach-ink:#fbd9be; --opt:#7fb0ec; --ok:#6cc088; --ok-bg:#1f3a28;
  --danger:#ff7a6e; --danger-bg:#4a1f1b; --warn-bg:#4a3613; --warn-ink:#f6cf86;
  --scrim:rgba(0,0,0,.55); color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{touch-action:manipulation;height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-visible{outline:2px solid var(--opt);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden}
#app>*{min-width:0}

header{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1.5px solid var(--line);background:var(--bg);z-index:5}
.brand{min-width:0;flex:1}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.01em;margin:0;line-height:1.05;text-transform:uppercase}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:999px;height:34px;min-width:34px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.pill.bad{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.pill svg{width:16px;height:16px}
.boardbtn{display:flex;align-items:center;gap:4px;background:none;border:0;padding:0;max-width:100%;text-align:left}
.boardbtn h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.boardbtn svg{width:18px;height:18px;flex:0 0 auto}

#vp{position:relative;overflow:hidden;touch-action:none;background-color:var(--board);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);cursor:grab}
#vp.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#lines{position:absolute;left:0;top:0;overflow:visible}
.ln{fill:none;stroke-linecap:round}
.ln.pair{stroke:var(--ink);stroke-width:3.5}
.ln.pair.juntos{stroke:var(--ok)}
.ln.pair.separados{stroke:var(--muted);stroke-width:3}
.ln.opt{stroke:var(--opt);stroke-width:2.5;stroke-dasharray:7 7}
.ln.bad{stroke:var(--danger)}
.hit{fill:none;stroke:transparent;stroke-width:26;pointer-events:stroke;cursor:pointer}
.tag rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.tag text{font:600 11px var(--f-body);fill:var(--muted)}
.tag.opt text{fill:var(--opt)}
.tag.juntos rect{fill:var(--ok-bg);stroke:var(--ok)} .tag.juntos text{fill:var(--ok)}
.tag.bad rect{fill:var(--danger-bg);stroke:var(--danger)} .tag.bad text{fill:var(--danger)}
.tag.warn rect{fill:var(--warn-bg);stroke:transparent} .tag.warn text{fill:var(--warn-ink)}

.node{position:absolute;width:118px;background:var(--card);border-radius:14px;border:2px solid var(--line);overflow:hidden;cursor:grab;touch-action:none;transition:box-shadow .15s}
.node.m{border-color:var(--male)} .node.f{border-color:var(--fem)}
.node.dragging{box-shadow:0 14px 30px rgba(0,0,0,.22);cursor:grabbing;z-index:50}
.node.target{outline:3px solid var(--opt);outline-offset:3px}
.ph{height:118px;background:var(--unk-bg) center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:34px;color:var(--unk-ink)}
.m .ph{background-color:var(--male-bg);color:var(--male-ink)} .f .ph{background-color:var(--fem-bg);color:var(--fem-ink)}
.ph.has{font-size:0}
.sx{position:absolute;left:6px;top:6px;height:24px;min-width:24px;padding:0 6px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 13px var(--f-body);background:var(--unk);color:#fff}
.m .sx{background:var(--male)} .f .sx{background:var(--fem)}
.wb{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;font:800 13px var(--f-body);display:flex;align-items:center;justify-content:center}
.wb.w{background:#d08a1a}
.vis.cat{background:var(--ink);color:var(--bg)}
.vis{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--peach);color:var(--peach-ink);padding:2px 6px;border-radius:6px}
.meta{padding:6px 8px 8px;display:grid;gap:1px}
.meta b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.meta .mo{color:var(--ink);font-weight:500}
.meta .wt{font-variant-numeric:tabular-nums}

#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none}
.ecard{pointer-events:auto;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px;max-width:300px;text-align:center;display:grid;gap:10px}
.ecard h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0;text-transform:uppercase;text-wrap:balance}
.ecard p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}

#trash{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--card);border:2px dashed var(--danger);color:var(--danger);display:flex;align-items:center;justify-content:center;z-index:6;transition:transform .12s}
#trash.hot{transform:translateX(-50%) scale(1.18);background:var(--danger);color:#fff;border-style:solid}
#trash svg{width:26px;height:26px}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500;padding:9px 14px;border-radius:12px;max-width:calc(100% - 32px);width:max-content;z-index:7;pointer-events:none}
#note{position:absolute;left:12px;top:10px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;z-index:4}

#tray{border-top:1.5px solid var(--line);background:var(--bg);padding:8px 0 10px}
.trayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 6px;font-size:12px;color:var(--muted)}
.trayhead b{font-size:11px;letter-spacing:.12em;color:var(--ink);flex:0 0 auto}
#tcount{font-weight:600;letter-spacing:0;color:var(--muted)}
.filt{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;justify-content:flex-start}
.filt::-webkit-scrollbar{display:none}
.filt button{height:28px;min-width:32px;padding:0 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;flex:0 0 auto}
.filt button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.trow{display:flex;gap:10px;overflow-x:auto;padding:2px 14px 4px;touch-action:none;scrollbar-width:none;-webkit-user-select:none}
.trow::-webkit-scrollbar{display:none}
.titem{position:relative;flex:0 0 auto;width:66px;display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0;touch-action:none;-webkit-touch-callout:none}
.tav{width:62px;height:62px;border-radius:14px;border:3px solid var(--unk);overflow:hidden;background:var(--unk-bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:20px;color:var(--unk-ink)}
.titem.m .tav{border-color:var(--male);background-color:var(--male-bg);color:var(--male-ink)}
.titem.f .tav{border-color:var(--fem);background-color:var(--fem-bg);color:var(--fem-ink)}
.titem.dim .tav{opacity:.45}
.tav.has{font-size:0}
.titem span{font-size:11.5px;font-weight:600;max-width:66px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem.add .tav{border:2px dashed var(--muted);background:transparent;color:var(--muted)}
.titem.add .tav svg{width:24px;height:24px}
.onb{position:absolute;top:-4px;right:-2px;z-index:1;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
.onb svg{width:11px;height:11px}
.ghost{position:fixed;z-index:60;pointer-events:none;width:72px;height:72px;margin:-36px 0 0 -36px;opacity:.92}
.ghost .tav{width:72px;height:72px}
.titem.press .tav{transform:scale(.92);transition:transform .45s}
.titem.sel .tav{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--opt);transform:scale(1.06)}
#pick{position:absolute;left:12px;right:12px;bottom:12px;margin:0 auto;max-width:440px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px;z-index:7;font-size:14px;font-weight:500}
#pick span{flex:1;min-width:0;line-height:1.3}
#pick button{flex:0 0 auto;height:34px;padding:0 12px;border-radius:9px;border:0;background:var(--bg);color:var(--ink);font-weight:700;font-size:13px}
#pick button.x{width:34px;padding:0;background:transparent;color:var(--bg);border:1.5px solid currentColor}

#scrim{position:fixed;inset:0;background:var(--scrim);z-index:70}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:90%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;z-index:71;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));user-select:text;-webkit-user-select:text}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.xbtn{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:2}
.xbtn svg{width:18px;height:18px}
.sh{padding-right:40px}
.sh{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.sh>div{min-width:0}
.sh h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.sh p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.acts{display:grid;gap:8px}
.act{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:15px}
.act svg{width:20px;height:20px;flex:0 0 auto}
.act.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.danger{color:var(--danger)}
.act.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.act.sm{padding:9px 12px;font-size:14px}
.form{display:grid;gap:12px}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{position:relative;overflow:hidden;width:110px;height:110px;border-radius:16px;border:2px dashed var(--line);background:var(--bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto}
.photo .pv.has{border-style:solid}
.upl{position:relative;overflow:hidden;cursor:pointer}
.pastebox{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.pastebox p{margin:0 0 6px}.pastebox ol{margin:0;padding-left:18px;display:grid;gap:6px}
.pastebox input{display:block;width:100%;margin-top:6px;height:42px;border-radius:10px;border:1.5px dashed var(--warn-ink);background:var(--card);color:var(--ink);padding:0 10px;font:inherit;font-size:16px}
.upl input[type=file],.pvin{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.photo .pv svg{width:28px;height:28px}
.photo label{flex:1}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld select,.fld textarea{width:100%;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.fld textarea{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.c2{grid-template-columns:repeat(2,1fr)} .seg.c4{grid-template-columns:repeat(4,1fr)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;align-items:center;justify-content:center;gap:5px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;cursor:pointer;text-align:center;padding:0 4px}
.seg input:checked+label{border-color:transparent;box-shadow:inset 0 0 0 2px var(--ink);background:var(--card)}
#sx-M:checked+label{background:var(--male-bg);color:var(--male-ink);box-shadow:inset 0 0 0 2px var(--male)}
#sx-F:checked+label{background:var(--fem-bg);color:var(--fem-ink);box-shadow:inset 0 0 0 2px var(--fem)}
#sx-U:checked+label{background:var(--unk-bg);color:var(--unk-ink);box-shadow:inset 0 0 0 2px var(--unk)}
.chk{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:500;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--danger)}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.4}
.list li i{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 12px var(--f-body);font-style:normal;color:#fff;background:var(--danger)}
.list li.w i{background:#d08a1a} .list li.n i{background:var(--ink);color:var(--bg)} .list li.ok i{background:var(--ok)}
.legend{display:grid;gap:8px;margin:14px 0 4px}
.legend div{display:flex;align-items:center;gap:10px;font-size:13.5px}
.legend svg{flex:0 0 auto}
.ex{background:var(--peach);color:var(--peach-ink);border:0}
.blist{display:grid;gap:8px;margin-bottom:14px}
.bitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.bitem b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem span{font-size:12.5px;color:var(--muted);flex:0 0 auto}
.bitem.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.inl{display:flex;gap:8px}
.inl input,.inl select{flex:1;min-width:0;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.inl .act{width:auto;flex:0 0 auto}
.secttl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:14px 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0 0 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.notes{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.45;white-space:pre-wrap}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--unk-bg);color:var(--unk-ink);vertical-align:middle}
.badge.v{background:var(--peach);color:var(--peach-ink)} .badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bad{background:var(--danger-bg);color:var(--danger)} .badge.w{background:var(--warn-bg);color:var(--warn-ink)}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:14px;font-variant-numeric:tabular-nums}
.wrow .d{color:var(--muted);font-size:13px} .wrow .up{color:var(--ok)} .wrow .dn{color:var(--danger)}
.wrow button{background:none;border:0;color:var(--muted);padding:4px}
.wrow button svg{width:16px;height:16px}
.crow{grid-template-columns:auto 1fr auto}
.ro .crow button{display:none}
.crow>span:nth-child(2){min-width:0}
.cedit{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:6px}
.cedit .fld:nth-child(3){grid-column:1/-1}
.cedit .act{grid-column:1/-1;justify-content:center}
.spark{width:100%;height:70px;display:block;margin:0 0 10px}
.gen{display:grid;gap:6px;margin:0 0 12px}
.gen div{display:grid;gap:2px;padding:9px 12px;border-radius:10px;background:var(--bg);font-size:14px}
.gen div span{color:var(--muted);font-size:12.5px;font-weight:600}
.gen div.warn{box-shadow:inset 3px 0 0 #d08a1a}

<script>
/* STORE: everything on this phone (IndexedDB), with backup */
const STORE=(()=>{
  let idb=null; let cbs=null;
  function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open('gecko-pairs-en',1);
    r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('geckos')) d.createObjectStore('geckos',{keyPath:'id'}); if(!d.objectStoreNames.contains('boards')) d.createObjectStore('boards',{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  function tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=idb.transaction(store,mode); const req=fn(t.objectStore(store)); t.oncomplete=()=>res(req&&req.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
  const getAll=st=>tx(st,'readonly',s=>s.getAll());
  const ID=/^[A-Za-z0-9_.:@+~-]{1,80}$/, PH=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/, DT=/^\d{4}-\d{2}-\d{2}$/;
  const str=(v,n)=>typeof v==='string'?v.slice(0,n||200):'';
  function clean(d){ if(!d||d.app!=='gecko-pairs-en'||!Array.isArray(d.geckos)||!Array.isArray(d.boards)) return null;
    const geckos=d.geckos.filter(g=>g&&ID.test(g.id)&&typeof g.name==='string'&&g.name.trim()).map(g=>({...g,name:str(g.name,40),sex:['M','F','U'].includes(g.sex)?g.sex:'U',morph:str(g.morph,80),notes:str(g.notes,800),
      photo:typeof g.photo==='string'&&PH.test(g.photo)?g.photo:'',weights:Array.isArray(g.weights)?g.weights.filter(w=>w&&DT.test(w.d)&&Number.isFinite(+w.g)).map(w=>({d:w.d,g:+w.g})):[]}));
    const boards=d.boards.filter(b=>b&&ID.test(b.id)).map(b=>({id:b.id,name:str(b.name,40)||'Board',created:+b.created||Date.now(),updated:+b.updated||Date.now(),
      nodes:(Array.isArray(b.nodes)?b.nodes:[]).filter(n=>n&&ID.test(n.id)&&ID.test(n.g)).map(n=>({id:n.id,g:n.g,x:+n.x||0,y:+n.y||0,...(typeof n.from==='string'&&ID.test(n.from)?{from:n.from}:{})})),
      links:(Array.isArray(b.links)?b.links:[]).filter(l=>l&&ID.test(l.id)&&ID.test(l.m)&&ID.test(l.f)).map(l=>({...l,k:l.k==='opt'?'opt':'pair',notes:str(l.notes,500),clutches:Array.isArray(l.clutches)?l.clutches.filter(c=>c&&ID.test(c.id)&&DT.test(c.d)):[]}))}));
    return {geckos,boards}; }
  const bare=(id,b)=>({id,name:b.name||'My board',created:b.created||Date.now(),updated:b.updated||Date.now(),nodes:b.nodes||[],links:b.links||[]});
  async function readAll(){ const g={}; (await getAll('geckos')).forEach(x=>{ g[x.id]=x; }); const b={}; (await getAll('boards')).forEach(x=>{ const {id,...rest}=x; b[id]=rest; }); return {g,b}; }
  function saveFile(filename,text,type){ const file=new File([text],filename,{type});
    return (async()=>{ try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:filename}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
      const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },3000); })(); }
  return {
    async init(cb){ cbs=cb; try{ idb=await openDB(); }catch(e){ idb=null; cb.note('This browser cannot save data. Open it in Safari or Chrome.'); return false; }
      try{ const {g,b}=await readAll(); cb.geckos(g); cb.boards(b); }catch(e){ cb.note('Could not read your data'); return false; }
      if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
      if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
      return true; },
    putGecko(g){ if(!idb) return Promise.resolve(); return tx('geckos','readwrite',s=>s.put(g)); },
    delGecko(id){ if(!idb) return Promise.resolve(); return tx('geckos','readwrite',s=>s.delete(id)); },
    putBoard(id,b){ if(!idb) return Promise.resolve(); return tx('boards','readwrite',s=>s.put(bare(id,b))); },
    delBoard(id){ if(!idb) return Promise.resolve(); return tx('boards','readwrite',s=>s.delete(id)); },
    download(filename,text,type){ return saveFile(filename,text,type); },
    dataActions(el,getData){
      el.insertAdjacentHTML('beforeend',`<button class="act" id="bexp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M4 19h16"/></svg><span>Export backup</span></button>
        <label class="act" for="bimp-file" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V8M7 13l5-5 5 5M4 5h16"/></svg><span>Import backup</span></label>
        <input type="file" id="bimp-file" accept="application/json,.json" hidden>
        <button class="act danger" id="bimp-ok" hidden><span></span></button>
        <p class="hint" style="margin:0">Everything is saved only on this phone. Export a backup now and then and keep it in Files, iCloud Drive or a chat with yourself. If you delete the app or clear website data, anything not backed up is lost.</p>`);
      document.getElementById('bexp').onclick=()=>{ const cur=getData(); const data={app:'gecko-pairs-en',v:2,exported:new Date().toISOString(),geckos:Object.values(cur.geckos),boards:Object.entries(cur.boards).map(([id,x])=>({id,name:x.name,created:x.created,updated:x.updated,nodes:x.nodes,links:x.links}))};
        saveFile(`gecko-pairs-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(data),'application/json'); };
      document.getElementById('bimp-file').onchange=async e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return; let d=null; try{ d=clean(JSON.parse(await f.text())); }catch(_){ d=null; }
        const er=document.getElementById('bimp-err'); if(!d){ er.textContent='That file is not a backup from this app, or it is damaged.'; er.hidden=false; return; }
        er.hidden=true; const ok=document.getElementById('bimp-ok'); ok.hidden=false; ok.lastChild.textContent=`Replace everything with the backup (${d.geckos.length} ${d.geckos.length===1?'gecko':'geckos'}, ${d.boards.length} ${d.boards.length===1?'board':'boards'})`;
        ok.onclick=async()=>{ if(!ok.classList.contains('armed')){ ok.classList.add('armed'); ok.lastChild.textContent='Tap again: current data will be erased'; return; }
          await tx('geckos','readwrite',s=>{ s.clear(); d.geckos.forEach(g=>{ if(g&&g.id&&g.name) s.put(g); }); });
          await tx('boards','readwrite',s=>{ s.clear(); d.boards.forEach(b=>{ if(b&&b.id) s.put(bare(b.id,b)); }); });
          location.reload(); }; };
    }
  };
})();

</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const vp=$('#vp'), world=$('#world'), svgL=$('#lines'), nodesEl=$('#nodes');
const NW=118, NH=182, MIN_W_F=35, MIN_W_M=30, MIN_M=18, WEIGH_DAYS=14;
let loaded=false, fitted=false;
let geckos={}, boards={}, cur=null, board={name:'My board',nodes:[],links:[]};
let filter='all', search='', undoStack=[];
const LS='geckopairs.en.board';
const lsGet=()=>{ try{ return localStorage.getItem(LS); }catch(_){ return null; } };
const lsSet=v=>{ try{ localStorage.setItem(LS,v); }catch(_){} };
const cloneB=b=>({name:b.name||'My board',created:b.created||0,updated:b.updated||0,nodes:(b.nodes||[]).map(n=>({...n})),links:(b.links||[]).map(l=>({...l,clutches:(l.clutches||[]).map(c=>({...c}))}))});
function snap(){ undoStack.push(JSON.stringify({nodes:board.nodes,links:board.links})); if(undoStack.length>40) undoStack.shift(); }
function undo(){ const s=undoStack.pop(); if(!s) return; const v=JSON.parse(s); board.nodes=v.nodes; board.links=v.links; touchBoard(); render(); toast('Undone.'); }

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nodeById=id=>board.nodes.find(n=>n.id===id);
const gOf=n=>n&&geckos[n.g];
const SX={M:'♂',F:'♀',U:'?'};
const SXN={M:'Male',F:'Female',U:'Unsexed'};
const sxLabel=g=>g.sex==='U'?'?':SX[g.sex]+(g.sexSure===false?'?':'');
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=s=>{ if(!s) return ''; const [y,m,d]=s.split('-'); return `${+d} ${MON[+m-1]} ${y}`; };
const daysSince=s=>{ if(!s) return null; const [y,m,d]=String(s).split('-').map(Number); if(!y||!m||!d) return null; const t=new Date(); return Math.max(0,Math.round((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(y,m-1,d))/864e5)); };
const fmtG=n=>(Math.round(n*100)/100).toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:2});

function monthsOld(b){ if(!b) return null; const d=new Date(b+'T12:00:00'); if(isNaN(d)) return null; const n=new Date();
  let m=(n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth()); if(n.getDate()<d.getDate()) m--; return Math.max(0,m); }
function ageShort(b){ const m=monthsOld(b); if(m===null) return 'Age ?'; if(m<1) return '<1m'; const y=Math.floor(m/12), r=m%12; if(!y) return m+'m'; return y+'y'+(r?' '+r+'m':''); }
function ageText(b){ const m=monthsOld(b); if(m===null) return 'Age not set'; if(m<1) return 'Under 1 month';
  const y=Math.floor(m/12), r=m%12; if(!y) return m+(m===1?' month':' months'); return y+(y===1?' year':' years')+(r?' '+r+(r===1?' month':' months'):''); }
function stage(g){ const m=monthsOld(g.birth); if(m===null) return g.grupo&&/cr[ií]a|hatchl|juv/i.test(g.grupo)?'cria':'adult'; return m<12?'cria':m<MIN_M?'juv':'adult'; }
const STAGE={cria:'Juvenile',juv:'Sub-adult',adult:'Adult'};
const isVisita=g=>g.status==='visita';
const isActive=g=>!g.planned&&!(g.status==='vendido'||g.status==='fallecido'||(isVisita(g)&&g.hasta&&g.hasta<today()));
const CATS=['RTB','RTB PROVEN','PET','JUVENILE','HOLDBACK','FOR SALE'];
const CATSHORT={'RTB':'RTB','RTB PROVEN':'PROVEN','PET':'PET','JUVENILE':'JUVENILE','HOLDBACK':'HOLDBACK','FOR SALE':'FOR SALE'};
const STATUS={externo:'External (another breeder’s, for planning)',propio:'Owned',visita:'On loan',reservado:'Reserved',vendido:'Sold',fallecido:'Deceased'};

/* ---------- weights ---------- */
function wSorted(g){ return (g.weights||[]).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0); }
function lastW(g){ const w=wSorted(g); return w.length?w[w.length-1]:null; }
function prevW(g){ const w=wSorted(g); return w.length>1?w[w.length-2]:null; }
function wInfo(g){ const l=lastW(g); if(!l) return null; const p=prevW(g); const days=daysSince(l.d);
  return {g:l.g,d:l.d,days,delta:p?l.g-p.g:null,pct:p&&p.g?(l.g-p.g)/p.g*100:null}; }

/* ---------- genetics ---------- */
const GENES=[
  {k:'lw',name:'Lilly White',type:'id',lethal:true,re:/lilly|\blw\b/i},
  {k:'cap',name:'Cappuccino',type:'id',lethal:true,re:/cappucc?ino|frappucc?ino/i},
  {k:'ax',name:'Axanthic',type:'rec',re:/axanth/i},
  {k:'ph',name:'Phantom',type:'rec',re:/phantom/i},
  {k:'ss',name:'Soft Scale',type:'rec',re:/soft\s*scale/i},

    </div>`);
  $('#a-photo').addEventListener('click',()=>watchPicker(()=>{ const h=$('#a-help'); if(h) h.hidden=false; }));
  $('#a-pastein').addEventListener('paste',async e=>{ const f=pastedImage(e); if(!f) return; e.preventDefault(); $('#a-photo').onchange({target:{files:[f],set value(v){}}}); });

    try{ const ph=await processImage(f); const ng={...g,photo:ph}; await saveGecko(ng); toast(`Photo of ${g.name} saved.`); openNodeSheet(nid); }catch(_){ toast('Could not read that image. Try another photo.'); } };
  $('#a-weigh').onclick=()=>openWeigh(g.id,()=>openNodeSheet(nid));
  $('#a-edit').onclick=()=>openGeckoForm(g.id);
  $('#a-dup').onclick=()=>{ addNode(g.id,n.x+NW/2+NW+28,n.y+NH/2); closeSheet(); toast(`Copy of ${g.name} added to the right.`); };

  $('#a-del').onclick=()=>{ snap(); removeNode(nid); touchBoard(); render(); closeSheet(); toast(`${g.name} removed from the board. Still in your collection.`); };
}

function openWeigh(gid,back){ const g=geckos[gid]; if(!g) return; const w=wSorted(g).slice().reverse();
  openSheet(`<div class="sh">${avatar(g,52)}<div><h3>Weigh-ins · ${esc(g.name)}</h3><p>${w.length?w.length+(w.length===1?' record':' records'):'No weigh-ins yet'}</p></div></div>
    ${spark(g)}
    <form class="inl" id="wform" style="margin-bottom:12px"><input type="date" id="w-d" value="${today()}" max="${today()}" aria-label="Date"><input type="text" id="w-g" inputmode="decimal" autocomplete="off" step="0.01" min="0" placeholder="g" style="flex:0 0 96px" aria-label="Weight in grams"><button class="act primary" type="submit">Add</button></form>
    <p class="err" id="w-err" hidden></p>
    <div class="acts" id="wlist">${w.slice(0,40).map((x,i)=>{ const p=w[i+1]; const dl=p?x.g-p.g:null; return `<div class="wrow"><span class="d">${fmtD(x.d)}</span><span><b>${fmtG(x.g)} g</b>${dl!==null?` <span class="${dl<0?'dn':dl>0?'up':''}">${dl>0?'+':''}${fmtG(dl)}</span>`:''}</span><button data-del="${x.d}" aria-label="Delete weigh-in">${IC.trash}</button></div>`; }).join('')}</div>
    ${w.length>40?'<p class="hint">Showing the latest 40.</p>':''}
    <div class="acts" style="margin-top:12px"><button class="act" id="w-back">${IC.edit}<span>Back to profile</span></button></div>`);

    g.weights=(g.weights||[]).filter(x=>x.d!==d); g.weights.push({d,g:Math.round(v*100)/100}); saveGecko(g); openWeigh(gid,back); toast(`${g.name}: ${fmtG(v)} g.`); };
  sheet.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ g.weights=(g.weights||[]).filter(x=>x.d!==b.dataset.del); saveGecko(g); openWeigh(gid,back); });
  $('#w-back').onclick=()=>back?back():openGeckoForm(gid); }

function openWeighAll(){ const all=Object.values(geckos).filter(g=>isActive(g)&&g.status!=='externo').map(g=>({g,wi:wInfo(g)}))
    .sort((a,b)=>{ const da=a.wi?a.wi.days:1e9, db=b.wi?b.wi.days:1e9; return db-da||a.g.name.localeCompare(b.g.name,'es'); });
  const due=all.filter(x=>!x.wi||x.wi.days>WEIGH_DAYS).length, down=all.filter(x=>x.wi&&x.wi.delta!==null&&x.wi.delta<0).length;

    <p class="hint" style="margin:0 0 10px">Enter the weight for today and tap ✓. Tap a name to see its history.</p>
    <div class="acts" id="wall">${all.map(({g,wi})=>`<div class="prow${!wi||wi.days>WEIGH_DAYS?' w':''}${wi&&wi.pct!==null&&wi.pct<-5?' bad':''}" data-g="${g.id}"><button class="prow" style="padding:0;flex:1;min-width:0;background:none" data-open="${g.id}">${avatar(g,40,'tav')}<b>${esc(g.name)} ${sxLabel(g)}<br><small>${wi?`${fmtG(wi.g)} g · ${wi.days===0?'today':wi.days+' d'}${wi.delta!==null?` · <span style="color:${wi.delta<0?'var(--danger)':wi.delta>0?'var(--ok)':'inherit'}">${wi.delta>0?'+':''}${fmtG(wi.delta)}</span>`:''}`:'no weigh-ins'}</small></b></button><input type="text" inputmode="decimal" autocomplete="off" placeholder="g" aria-label="Weight of ${esc(g.name)}"><button class="go" aria-label="Save">${IC.check}</button></div>`).join('')}</div>`);
  sheet.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openWeigh(b.dataset.open,openWeighAll));
  sheet.querySelectorAll('.prow[data-g]').forEach(row=>{ const inp=row.querySelector('input'), go=row.querySelector('.go'); const save=()=>{ const v=parseFloat((inp.value||'').replace(',','.')); if(!Number.isFinite(v)||v<=0){ inp.focus(); return; }
      const g=geckos[row.dataset.g]; const d=today(); g.weights=(g.weights||[]).filter(x=>x.d!==d); g.weights.push({d,g:Math.round(v*100)/100}); saveGecko(g); toast(`${g.name}: ${fmtG(v)} g.`); inp.value=''; row.classList.remove('w','bad'); row.querySelector('small').textContent=`${fmtG(v)} g · today`; };
    go.onclick=save; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } }; }); }

function clutchRes(c){ if(c.nac>0) return 'nac'; if(c.fert===0||c.nac===0) return 'mal'; return 'inc'; }
function clutchTotals(cl){ return {n:cl.length,p:cl.length,h:cl.reduce((s,c)=>s+(+c.n||0),0),f:cl.reduce((s,c)=>s+(c.fert??(c.res==='mal'?0:c.res==='nac'?c.n:0)),0),b:cl.reduce((s,c)=>s+(c.nac??(c.res==='nac'?c.n:0)),0)}; }
function clutchRow(c){ return clutchRow0(c).replace(/<\/div>$/,clutchExtra(c)+'</div>'); }
function clutchRow0(c){ const res=c.res||clutchRes(c); const inc=res==='inc'; const dd=c.dn&&c.d?Math.round((new Date(c.dn)-new Date(c.d))/864e5):null; const di=inc?daysSince(c.d):null;
  const bits=[`${c.n} egg${c.n>1?'s':''}`]; if(c.fert!=null) bits.push(`${c.fert} fertile`);
  const st=res==='nac'?`<span class="up">${c.nac??c.n} hatched${c.dn?' on '+fmtD(c.dn):''}${dd?` (${dd} d)`:''}</span>`:res==='mal'?'<span class="dn">not viable</span>':`incubating${di!==null?` · ${di} d`:''}`;
  return `<div class="wrow crow"><span class="d">${fmtD(c.d)}</span><span>${bits.join(' · ')} · ${st}</span><span style="display:flex;gap:2px"><button data-cres="${c.id}" aria-label="Record result">${IC.egg}</button><button data-cdel="${c.id}" aria-label="Delete clutch">${IC.trash}</button></span></div>`; }
function openLinkSheet(lid){ const l=board.links.find(x=>x.id===lid); if(!l) return; const m=gOf(nodeById(l.m)), f=gOf(nodeById(l.f)); if(!m||!f) return;
  const p=predict(m,f), rel=related(m,f); const st=l.status||'planeada'; const cl=(l.clutches||[]).slice().sort((a,b)=>a.d<b.d?1:-1);
  openSheet(`<div class="sh" style="gap:6px">${avatar(m,52)}${avatar(f,52)}<div style="margin-left:6px"><h3>${esc(m.name)} × ${esc(f.name)}</h3><p>${l.k==='pair'?(st==='juntos'?'Together'+(l.desde?' since '+fmtD(l.desde):''):st==='separados'?'Separated'+(l.hasta?' on '+fmtD(l.hasta):''):'Planned pair'):'Option under consideration'}</p></div></div>
    ${rel?`<ul class="list" style="margin-bottom:12px"><li><i>!</i><span>${esc(m.name)} and ${esc(f.name)} are ${rel}. Avoid inbreeding.</span></li></ul>`:''}
    ${p.lethal?`<ul class="list" style="margin-bottom:12px"><li><i>!</i><span>Both carry ${p.out.filter(x=>x.bad).map(x=>x.gene.name).join(' and ')}. About 25% of the offspring would be super, which is not viable.</span></li></ul>`:''}
    <p class="secttl" style="margin-top:0">Possible outcomes</p>
    ${p.out.length?`<div class="gen">${p.out.map(x=>`<div class="${x.warn?'warn':''}"><span>${esc(x.gene.name)}</span><b>${esc(x.txt)}</b></div>`).join('')}</div>`:'<p class="hint" style="margin:0 0 12px">No simple-inheritance genes found in these morphs.</p>'}
    <p class="hint" style="margin:0 0 12px">Harlequin, dalmatian, portholes, tiger, charcoal and base colour are polygenic, so there are no percentages. Hets written in the morph (“het axanthic”) are taken into account.</p>
    ${l.k==='pair'?`<p class="secttl">Status</p>
    <div class="seg" style="margin-bottom:10px"><input type="radio" name="lst" id="lst-planeada" value="planeada"${st==='planeada'?' checked':''}><label for="lst-planeada">Planned</label><input type="radio" name="lst" id="lst-juntos" value="juntos"${st==='juntos'?' checked':''}><label for="lst-juntos">Together</label><input type="radio" name="lst" id="lst-separados" value="separados"${st==='separados'?' checked':''}><label for="lst-separados">Separated</label></div>
    <div class="row2" style="margin-bottom:10px"><label class="fld"><span>Together since</span><input type="date" id="l-desde" value="${esc(l.desde||'')}"></label><label class="fld"><span>Separated on</span><input type="date" id="l-hasta" value="${esc(l.hasta||'')}"></label></div>
    <label class="fld" style="margin-bottom:10px"><span>Notes</span><textarea id="l-notes" maxlength="500" placeholder="Mating seen, behaviour, enclosure…">${esc(l.notes||'')}</textarea></label>
    <p class="secttl">Clutches</p>
    <form class="inl" id="cform" style="margin-bottom:8px"><input type="date" id="c-d" value="${today()}" aria-label="Lay date"><select id="c-n" aria-label="Eggs" style="flex:0 0 108px;padding:0 8px"><option value="1">1 egg</option><option value="2" selected>2 eggs</option><option value="3">3 eggs</option></select><button class="act" type="submit">+ Clutch</button></form>
    ${(()=>{ const t=clutchTotals(l.clutches||[]); return t.n?`<p class="hint" style="margin:0 0 8px">${t.p} clutch${t.p===1?'':'es'} · ${t.h} egg${t.h===1?'':'s'} · ${t.f} fertile · ${t.b} hatched</p>`:''; })()}
    ${cl.length?`<div class="acts" style="margin-bottom:12px">${cl.map(c=>clutchRow(c)).join('')}</div><p class="hint" style="margin:-6px 0 12px">Tap the egg to record fertile, hatched and hatch date.</p>`:''}
    <div class="acts"><button class="act primary" id="a-save">${IC.check}<span>Save</span></button>`:`<div class="acts"><button class="act primary" id="a-pick">${IC.check}<span>Choose ${esc(m.name)} for ${esc(f.name)}</span></button>`}
      ${l.k==='pair'?`<button class="act" id="a-baby">${IC.egg}<span>${PL.addBaby}</span></button>`:''}
      <button class="act danger" id="a-unl">${IC.cut}<span>Remove this pairing</span></button>
    </div>
    ${l.k==='opt'&&cl.length?`<p class="secttl">Recorded clutches</p><div class="acts ro">${cl.map(c=>clutchRow(c)).join('')}</div>`:''}
    ${l.k==='opt'?'<p class="hint" style="margin-top:12px">If you choose him, her current male becomes an option (his clutches are kept).</p>':''}`);
  if(l.k==='opt') $('#a-pick').onclick=()=>{ snap(); board.links.forEach(x=>{ if(x.k==='pair'&&gOf(nodeById(x.f))?.id===f.id) x.k='opt'; }); l.k='pair'; touchBoard(); render(); closeSheet(); toast(`${m.name} × ${f.name} chosen.`); };
  else { const read=()=>{ l.status=(document.querySelector('input[name=lst]:checked')||{}).value||'planeada'; l.desde=$('#l-desde').value||''; l.hasta=$('#l-hasta').value||''; l.notes=$('#l-notes').value.trim(); };
    document.querySelectorAll('input[name=lst]').forEach(r=>r.onchange=()=>{ if(r.value==='juntos'&&!$('#l-desde').value) $('#l-desde').value=today(); if(r.value==='separados'&&!$('#l-hasta').value) $('#l-hasta').value=today(); });
    $('#a-save').onclick=()=>{ snap(); read(); touchBoard(); render(); closeSheet(); toast('Pair saved.'); };
    $('#cform').onsubmit=e=>{ e.preventDefault(); snap(); read(); l.clutches=l.clutches||[]; l.clutches.push({id:uid('c'),d:$('#c-d').value||today(),n:+$('#c-n').value,fert:null,nac:null,dn:'',res:'inc'}); touchBoard(); render(); openLinkSheet(lid); };
    sheet.querySelectorAll('[data-cres]').forEach(b=>b.onclick=()=>{ const c=l.clutches.find(x=>x.id===b.dataset.cres); const row=b.closest('.crow'); if(!c||!row||row.querySelector('.cedit')) return;
      const opts=(max,v)=>Array.from({length:max+1},(_,i)=>`<option value="${i}"${v===i?' selected':''}>${i}</option>`).join('');
      row.insertAdjacentHTML('beforeend',`<div class="cedit"><label class="fld"><span>Fertile</span><select data-k="fert">${opts(c.n,c.fert??(c.res==='mal'?0:c.n))}</select></label><label class="fld"><span>Hatched</span><select data-k="nac"><option value="">—</option>${opts(c.n,c.nac??-1)}</select></label><label class="fld"><span>Hatch date</span><input type="date" data-k="dn" value="${esc(c.dn||'')}"></label><button class="act primary sm" data-csave>Save</button></div>`);
      row.querySelector('[data-csave]').onclick=()=>{ snap(); read(); c.fert=+row.querySelector('[data-k=fert]').value; const nv=row.querySelector('[data-k=nac]').value; c.nac=nv===''?null:+nv; c.dn=row.querySelector('[data-k=dn]').value||''; if(c.dn&&c.nac===null) c.nac=c.fert; c.res=clutchRes(c); touchBoard(); render(); openLinkSheet(lid); }; });
    sheet.querySelectorAll('[data-cmake]').forEach(b=>b.onclick=()=>{ const c=l.clutches.find(x=>x.id===b.dataset.cmake); if(c) makeBabies(l,c,m,f,lid); });
    sheet.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{ snap(); read(); l.clutches=l.clutches.filter(x=>x.id!==b.dataset.cdel); touchBoard(); render(); openLinkSheet(lid); }); }
  { const ab=$('#a-baby'); if(ab) ab.onclick=()=>addPlannedBaby(lid); }
  $('#a-unl').onclick=()=>{ snap(); board.links=board.links.filter(x=>x.id!==lid); touchBoard(); render(); closeSheet(); };
}

function pastedImage(e){ const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(x=>x.kind==='file'&&/^image\//.test(x.type)); return it?it.getAsFile():null; }
function watchPicker(onFail){ let opened=false; const mark=()=>{ opened=true; }; window.addEventListener('blur',mark,{once:true}); document.addEventListener('visibilitychange',mark,{once:true});
  setTimeout(()=>{ window.removeEventListener('blur',mark); document.removeEventListener('visibilitychange',mark); if(!opened&&document.hasFocus()) onFail(); },1600); }
function processImage(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const im=new Image();
  im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
  im.onload=()=>{ try{ const w=im.naturalWidth||im.width, h=im.naturalHeight||im.height; if(!w||!h) throw 0; const S=Math.min(480,w,h), s=Math.min(w,h);
      const c=document.createElement('canvas'); c.width=S; c.height=S; const x=c.getContext('2d'); x.imageSmoothingQuality='high';
      x.drawImage(im,(w-s)/2,(h-s)/2,s,s,0,0,S,S); URL.revokeObjectURL(url); let d=c.toDataURL('image/jpeg',.82); if(d.length>180000) d=c.toDataURL('image/jpeg',.65); res(d); }
    catch(e){ URL.revokeObjectURL(url); rej(e); } };
  im.src=url; }); }
function parentOptions(sel,sex,self){ const keep=sel&&!(geckos[sel]&&(geckos[sel].sex===sex||geckos[sel].sex==='U')&&sel!==self); return '<option value="">—</option>'+(keep?`<option value="${esc(sel)}" selected>${esc(geckos[sel]?geckos[sel].name:sel)}</option>`:'')+Object.values(geckos).filter(g=>g.id!==self&&!g.planned&&(g.sex===sex||g.sex==='U')).sort((a,b)=>a.name.localeCompare(b.name,'es')).map(g=>`<option value="${g.id}"${sel===g.id?' selected':''}>${esc(g.name)}</option>`).join(''); }

    else put(a,side(a),l.f); });
  N.forEach(n=>{ if(!grp[n.id]) newG(n.id); });
  const nodeOfG={}; N.forEach(n=>{ (nodeOfG[n.g]=nodeOfG[n.g]||[]).push(n.id); });
  const parN=id=>{ const g=gOf(byId[id]); const o=[]; [g.padre,g.madre].forEach(pg=>(nodeOfG[pg]||[]).forEach(pn=>{ if(pn!==id) o.push(pn); })); return o; };
  groups.forEach(G=>{ G.slots=[...G.L.slice().reverse(),G.hub,...G.R]; G.solo=G.slots.length===1&&!LK.some(l=>l.m===G.hub||l.f===G.hub);
    G.pn=[...new Set(G.slots.flatMap(parN))]; G.pg=new Set(G.pn.map(pn=>grp[pn]).filter(x=>x&&x!==G)); });
  const colW=NW+180, soloW=NW+36, gapG=110, placed=new Set(), X={}; let y=0;
  const width=G=>G.solo?NW:G.slots.length*colW-(colW-NW);
  const line=list=>{ if(!list.length) return; let cur=null, depth=0;
    list.forEach(G=>{ const xs=G.pn.filter(pn=>X[pn]!=null).map(pn=>X[pn]); G.key=xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null; });
    list.sort((a,b)=>(a.key??-1e9)-(b.key??-1e9)||byId[a.hub].y-byId[b.hub].y||byId[a.hub].x-byId[b.hub].x);
    list.forEach(G=>{ const w=width(G); let left=cur==null?0:cur+(G.solo&&list[0].solo?soloW-NW:gapG); if(G.key!=null) left=cur==null?G.key-w/2:Math.max(left,G.key-w/2);
      G.slots.forEach((id,i)=>{ const n=byId[id]; n.x=Math.round(left+i*colW); n.y=y; X[id]=n.x+NW/2; }); placed.add(G); cur=left+w; depth=Math.max(depth,Math.max(G.L.length,G.R.length)-1); });
    y+=NH+(depth>0?24+depth*30:0)+(list.some(G=>!G.solo)?140:60); };
  const ready=G=>!placed.has(G)&&[...G.pg].every(p=>placed.has(p));
  const roots=groups.filter(G=>!G.pg.size&&!G.solo).sort((a,b)=>byId[a.hub].y-byId[b.hub].y||byId[a.hub].x-byId[b.hub].x);
  roots.forEach(R=>{ if(placed.has(R)) return; line([R]); let fam=new Set([R]);
    for(let k=0;k<12;k++){ const next=groups.filter(G=>ready(G)&&G.pg.size&&[...G.pg].some(p=>fam.has(p))); if(!next.length) break; line(next); fam=new Set(next); } });
  for(let k=0;k<20;k++){ const next=groups.filter(G=>ready(G)&&!G.solo); if(!next.length) break; line(next); }
  const left=groups.filter(G=>!placed.has(G)); for(let i=0;i<left.length;i+=3) line(left.slice(i,i+3).map(G=>{ G.pg=new Set(); G.pn=[]; return G; }));
  touchBoard(); render(); fit(); }
sheet.addEventListener('click',e=>{ const t=e.target.closest('[data-tree]'); if(t){ openTree(t.dataset.tree); return; } if(e.target.closest('[data-tidy]')){ closeSheet(); tidyBoard(); toast(PL2.tidied); } });

function csvEsc(v){ v=String(v??''); return /[",;\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCSV(){ const rows=[['Name','Sex','Sex confirmed','Morph','Hatch date','Age','Group','Category','Status','Owner (loan)','From','Until','Sire','Dam','Project','Last weight (g)','Last weigh-in date','Previous weight (g)','Change (g)','Days since weigh-in','Notes']];
  Object.values(geckos).sort((a,b)=>a.name.localeCompare(b.name,'es')).forEach(g=>{ if(g.planned) return; const wi=wInfo(g), p=prevW(g);
    rows.push([g.name,SX[g.sex]||'?',g.sex==='U'?'':(g.sexSure===false?'no':'yes'),g.morph||'',g.birth?fmtD(g.birth):'',g.birth?ageText(g.birth):'',g.grupo||'',g.cat||'',STATUS[g.status]||'Owned',g.owner||'',fmtD(g.desde),fmtD(g.hasta),parentName(g.padre),parentName(g.madre),g.project||'',wi?fmtG(wi.g):'',wi?fmtD(wi.d):'',p?fmtG(p.g):'',wi&&wi.delta!==null?fmtG(wi.delta):'',wi?wi.days:'',g.notes||'']); });
  rows.push([]); rows.push(['WEIGH-INS']); rows.push(['Name','Date','Weight (g)']);
  Object.values(geckos).sort((a,b)=>a.name.localeCompare(b.name,'es')).forEach(g=>wSorted(g).forEach(w=>rows.push([g.name,fmtD(w.d),fmtG(w.g)])));
  rows.push([]); rows.push(['PAIRS']); rows.push(['Board','Male','Female','Type','Status','Together since','Separated on','Clutches','Eggs','Fertile','Hatched','Notes']);
  Object.values(boards).forEach(b=>b.links.forEach(l=>{ const m=geckos[(b.nodes.find(n=>n.id===l.m)||{}).g], f=geckos[(b.nodes.find(n=>n.id===l.f)||{}).g]; if(!m||!f) return; const cl=l.clutches||[];
    rows.push([b.name,m.name,f.name,l.k==='pair'?'pair':'option',({planeada:'planned',juntos:'together',separados:'separated'})[l.status||'planeada']||l.status,fmtD(l.desde),fmtD(l.hasta),cl.length,clutchTotals(cl).h,clutchTotals(cl).f,clutchTotals(cl).b,l.notes||'']);
  }));
  rows.push([]); rows.push(['CLUTCHES']); rows.push(['Board','Male','Female','Lay date','Eggs','Fertile','Hatched','Hatch date','Incubation days','Result']);
  Object.values(boards).forEach(b=>b.links.forEach(l=>{ const m=geckos[(b.nodes.find(n=>n.id===l.m)||{}).g], f=geckos[(b.nodes.find(n=>n.id===l.f)||{}).g]; if(!m||!f) return;
    (l.clutches||[]).slice().sort((a,b)=>a.d<b.d?-1:1).forEach(c=>{ const res=c.res||clutchRes(c); rows.push([b.name,m.name,f.name,fmtD(c.d),c.n,c.fert??'',c.nac??'',fmtD(c.dn),c.dn&&c.d?Math.round((new Date(c.dn)-new Date(c.d))/864e5):'',res==='nac'?'hatched':res==='mal'?'not viable':'incubating']); }); }));
  { const pl=Object.values(geckos).filter(g=>g.planned&&ghostAlive(g)); if(pl.length){ rows.push([]); rows.push([PL.csvTitle]); rows.push(PL.csvHead);
    pl.forEach(g=>rows.push([g.name,parentName(g.padre),parentName(g.madre),PL.sexCsv[g.sex]||PL.sexCsv.U,g.morph||'',Object.values(boards).filter(b=>b.nodes.some(n=>n.g===g.id)).map(b=>b.name).join(' / ')||PL.noBoard])); } }
  return '﻿'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n'); }

}

 {t:'Welcome to Gecko Pairs',p:'Plan your breeding pairs on a visual board. Everything you add is saved <b>only on this phone</b>. This quick tour takes 30 seconds.',

let tourStep=0;
function tourSeen(){ try{ return localStorage.getItem(TOUR_KEY)==='1'; }catch(_){ return !!window.__tourSeen; } }
function tourDone(){ try{ localStorage.setItem(TOUR_KEY,'1'); }catch(_){} window.__tourSeen=true; $('#tour').hidden=true; $('#tour').innerHTML=''; }
function tourRender(){ const st=TOUR[tourStep], last=tourStep===TOUR.length-1, el=$('#tour');
  el.innerHTML=`<div class="tcard"><div class="tart">${st.a}</div><h2>${st.t}</h2><p>${st.p}</p><div class="tdots">${TOUR.map((_,i)=>`<i class="${i===tourStep?'on':''}"></i>`).join('')}</div>
    <div class="tbtns">${tourStep?'<button id="tBack">Back</button>':''}<button class="go" id="tNext">${last?'Get started':'Next'}</button></div>${last?'':'<button class="tskip" id="tSkip">Skip the tour</button>'}</div>`;
  el.hidden=false;
  $('#tNext').onclick=()=>{ if(last) tourDone(); else { tourStep++; tourRender(); } };
  const bk=$('#tBack'); if(bk) bk.onclick=()=>{ tourStep--; tourRender(); };
  const sk=$('#tSkip'); if(sk) sk.onclick=tourDone; }
function startTour(){ tourStep=0; closeSheet(); tourRender(); }

['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
init().then(()=>{ if(!tourSeen()) startTour(); });
})();
