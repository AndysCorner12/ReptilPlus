name: Build ReptilPlus

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS 15, iPhone)
    runs-on: macos-14
    timeout-minutes: 20

    steps:

      - name: Checkout código
        uses: actions/checkout@v4

      - name: Seleccionar Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Listar schemes disponibles
        run: |
          xcodebuild -list -project ReptilPlus.xcodeproj

      - name: Compilar (build only, sin ejecutar)
        run: |
          xcodebuild build \
            -project ReptilPlus.xcodeproj \
            -scheme ReptilPlus \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
